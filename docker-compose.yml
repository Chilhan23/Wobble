services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wobble-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      - APP_NAME=${APP_NAME:-wobble}
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=8080
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - TOKEN_SECRET=${TOKEN_SECRET}
      - TOKEN_TTL_HOURS=${TOKEN_TTL_HOURS:-24}
      - FILE_SIGNING_SECRET=${FILE_SIGNING_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - AI_ENDPOINT=${AI_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-openai/gpt-4o-mini}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - wobble_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: wobble-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  wobble_uploads:
